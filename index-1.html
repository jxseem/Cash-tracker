<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cash Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f7a4d">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2a24;--mute:#6b7770;--line:#e3dfd5;--save:#1f7a4d;--spend:#b4552d;--inc:#2a5d9f;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--ink:#eaf0ec;--mute:#92a099;--line:#2c3732;--save:#5fd39a;--spend:#f0a07c;--inc:#8fb8ee;--on:#0d1411}}
:root[data-theme="dark"]{--bg:#121816;--card:#1b2420;--ink:#eaf0ec;--mute:#92a099;--line:#2c3732;--save:#5fd39a;--spend:#f0a07c;--inc:#8fb8ee;--on:#0d1411}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);font-size:14px;margin:0 0 16px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.hero .lbl{color:var(--mute);font-size:14px}
.hero .big{font-size:40px;font-weight:700;color:var(--save);letter-spacing:-1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px;margin-top:2px}
.stat span{color:var(--mute);font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:14px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 4px}
input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
input:focus,button:focus-visible{outline:2px solid var(--save);outline-offset:1px}
.add{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:var(--save);color:var(--on);font-size:16px;font-weight:600}
.hint{font-size:13px;color:var(--mute);margin-top:8px;min-height:18px}
.range{display:flex;gap:8px}
.range div{flex:1}
.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row small{color:var(--mute);display:block}
.amt{text-align:right;white-space:nowrap}
.amt.i{color:var(--inc)}.amt.e{color:var(--spend)}.amt.w{color:var(--save)}
.del{background:none;border:0;color:var(--mute);font-size:13px;padding:0;margin-top:2px}
.empty{color:var(--mute);text-align:center;padding:14px 0}
h2{font-size:16px;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:13px}
.wk{padding:10px 0;border-top:1px solid var(--line)}
.wk:first-of-type{border-top:0}
.wk div{display:flex;justify-content:space-between;font-size:14px;color:var(--mute)}
.wk b{color:var(--ink);font-size:15px}
.reset{width:100%;padding:12px;border-radius:10px;border:1px solid var(--spend);background:transparent;color:var(--spend);font-size:15px}
</style>
</head>
<body>
<main>
<h1>Cash Tracker</h1>
<p class="sub">Income varumbol <span id="pct">10</span>% automatic aayi savings-il pokum. Baakki kayyil kittunna cash.</p>
<div class="hero">
<div class="lbl">Savings baakki (select cheytha date range-il)</div>
<div class="big" id="sav">₹0</div>
</div>
<div class="grid">
<div class="stat"><span>Income kitti</span><b id="inc">₹0</b></div>
<div class="stat"><span>Expense aayi</span><b id="exp">₹0</b></div>
<div class="stat"><span>Kayyil kittiyath</span><b id="spendable">₹0</b></div>
<div class="stat"><span>Expense kazhinju baakki</span><b id="left">₹0</b></div>
</div>
<div class="box">
<div class="tabs">
<button id="tI" class="on" type="button">Income</button>
<button id="tE" type="button">Expense</button>
<button id="tW" type="button">Savings edukkuka</button>
</div>
<label for="d">Date</label>
<input id="d" type="date">
<label for="a">Amount (₹)</label>
<input id="a" type="number" inputmode="decimal" min="0" placeholder="0">
<label for="n">Note (catering, vegetables, ...)</label>
<input id="n" type="text" placeholder="optional">
<div class="chips" id="chips"></div>
<button class="add" id="add" type="button">Income add cheyyuka</button>
<div class="hint" id="hint"></div>
</div>
<div class="box">
<h2>Savings percentage</h2>
<label for="r">Puthiya income-nu mathram badhakam (palaya entries maarilla)</label>
<input id="r" type="number" inputmode="decimal" min="0" max="100" step="0.5">
</div>
<div class="box">
<h2>Date range</h2>
<div class="range">
<div><label for="f">From</label><input id="f" type="date"></div>
<div><label for="t">To</label><input id="t" type="date"></div>
</div>
</div>
<div class="box">
<h2>Summary</h2><div class="tabs" id="pt"><button type="button" data-p="W" class="on">Aazhcha</button><button type="button" data-p="M">Maasam</button><button type="button" data-p="Y">Varsham</button></div>
<div id="weeks"></div>
</div>
<div class="box">
<h2>Entries</h2><input id="q" type="search" placeholder="Note search cheyyuka (ex: chaya)"><div class="hint" id="qs"></div>
<div id="list"></div>
</div>
<button class="reset" id="reset" type="button">Ellam clear cheyyuka</button>
</main>
<script>
(function(){
var KEY="cash-tracker-v2",RK="cash-tracker-v2-rate",type="I",data=[],rate=10,armed=0;
var $=function(i){return document.getElementById(i)};
function load(){try{var s=localStorage.getItem(KEY);data=s?JSON.parse(s):[];var r=parseFloat(localStorage.getItem(RK));if(r>=0&&r<=100)rate=r}catch(e){data=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(RK,String(rate))}catch(e){}}
function r2(n){return Math.round(n*100)/100}
function inr(n){return "₹"+r2(n).toLocaleString("en-IN")}
function ds(x){return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var LB={I:"Income add cheyyuka",E:"Expense add cheyyuka",W:"Savings-il ninnu edukkuka"};
var CL={I:"var(--save)",E:"var(--spend)",W:"var(--inc)"};
function setType(t){type=t;["I","E","W"].forEach(function(k){$("t"+k).className=k===t?"on":""});$("add").textContent=LB[t];$("add").style.background=CL[t]}
function totals(rows){var o={inc:0,exp:0,sv:0,wd:0};rows.forEach(function(x){if(x.t==="I"){o.inc+=x.a;o.sv+=x.a*x.r/100}else if(x.t==="E")o.exp+=x.a;else o.wd+=x.a});o.cash=o.inc-o.sv+o.wd;return o}
function mon(d){var x=new Date(d+"T00:00:00");var k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
var P="W",PN={W:"aazhcha",M:"maasam",Y:"varsham"};
function pk(d){return P==="W"?ds(mon(d)):P==="M"?d.slice(0,7)+"-01":d.slice(0,4)+"-01-01"}
function pe(s){return P==="W"?new Date(s.getFullYear(),s.getMonth(),s.getDate()+6):P==="M"?new Date(s.getFullYear(),s.getMonth()+1,0):new Date(s.getFullYear(),11,31)}
function lab(s,e){return P==="W"?fmt(s)+" – "+fmt(e):P==="M"?s.toLocaleDateString("en-IN",{month:"long",year:"numeric"}):String(s.getFullYear())}
function fmt(x){return x.toLocaleDateString("en-IN",{day:"numeric",month:"short"})}
function render(){
var f=$("f").value,t=$("t").value;
var rows=data.filter(function(x){return(!f||x.d>=f)&&(!t||x.d<=t)}).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.id-a.id});
var o=totals(rows);
$("pct").textContent=rate;
$("sav").textContent=inr(o.sv-o.wd);$("inc").textContent=inr(o.inc);$("exp").textContent=inr(o.exp);
$("spendable").textContent=inr(o.cash);$("left").textContent=inr(o.cash-o.exp);
$("left").style.color=o.cash-o.exp<0?"var(--spend)":"inherit";
var g={},ks=[];
rows.forEach(function(x){var k=pk(x.d);if(!g[k]){g[k]=[];ks.push(k)}g[k].push(x)});
var w="";
ks.sort().reverse().forEach(function(k){var s=new Date(k+"T00:00:00"),e=pe(s);var a=totals(g[k]);var pv=totals(data.filter(function(x){return x.d<k})),op=pv.cash-pv.exp;var ev=ds(e),tl=totals(data.filter(function(x){return x.d<=ev})),cl=tl.cash-tl.exp,svt=tl.sv-tl.wd;
w+='<div class="wk"><b>'+lab(s,e)+'</b><div><span>Income '+inr(a.inc)+'</span><span>Saved '+inr(a.sv-a.wd)+'</span></div><div><span>Expense '+inr(a.exp)+'</span><span>Ee '+PN[P]+' baakki '+inr(a.cash-a.exp)+'</span></div><div><span>Munpathe '+PN[P]+' baakki '+inr(op)+'</span><b>Ippo kayyil '+inr(cl)+'</b></div><div><span>Total savings (aa '+PN[P]+' vare)</span><span>'+inr(svt)+'</span></div></div>'});
$("weeks").innerHTML=w||'<div class="empty">Entries onnum illa.</div>';
var h="",q=$("q").value.trim().toLowerCase(),lr=q?rows.filter(function(x){return (x.n||"").toLowerCase().indexOf(q)>-1}):rows,qt=0;lr.forEach(function(x){if(x.t==="E")qt+=x.a});$("qs").textContent=q?lr.length+" entries · expense "+inr(qt):"";rows=lr;
rows.forEach(function(x){
var nm=x.n?esc(x.n):(x.t==="I"?"Income":x.t==="E"?"Expense":"Savings edutthu");
var ex=x.t==="I"?" · Savings "+inr(x.a*x.r/100)+" ("+x.r+"%)":"";
h+='<div class="row"><div><b>'+nm+'</b><small>'+x.d+ex+'</small><button class="del" data-id="'+x.id+'" type="button">Delete</button></div><div class="amt '+(x.t==="I"?"i":x.t==="E"?"e":"w")+'">'+(x.t==="E"?"−":"+")+inr(x.a)+'</div></div>'});
$("list").innerHTML=h||'<div class="empty">Entries onnum illa. Mukalil income add cheyyuka.</div>'}
["I","E","W"].forEach(function(k){$("t"+k).onclick=function(){setType(k)}});
$("add").onclick=function(){
var a=parseFloat($("a").value),d=$("d").value||ds(new Date());
if(!(a>0)){$("hint").textContent="Amount enter cheyyuka.";return}
var cur=totals(data).sv-totals(data).wd;
if(type==="W"&&a>cur){$("hint").textContent="Savings-il "+inr(cur)+" mathrame ullu.";return}
data.push({id:Date.now(),t:type,d:d,a:a,r:rate,n:$("n").value.trim()});
save();
$("hint").textContent=type==="I"?inr(a*rate/100)+" savings-il mattivechu. "+inr(a-a*rate/100)+" kayyil.":type==="E"?"Expense add cheythu.":inr(a)+" savings-il ninnu eduthu.";
$("a").value="";$("n").value="";render()};
$("r").onchange=function(){var v=parseFloat($("r").value);if(v>=0&&v<=100){rate=v;save();render()}else $("r").value=rate};
$("list").onclick=function(e){var id=e.target.getAttribute&&e.target.getAttribute("data-id");if(!id)return;data=data.filter(function(x){return String(x.id)!==id});save();render()};
$("reset").onclick=function(){
if(!armed){armed=1;$("reset").textContent="Sure aano? Onnu koodi tap cheyyuka";setTimeout(function(){armed=0;$("reset").textContent="Ellam clear cheyyuka"},4000);return}
armed=0;data=[];save();$("reset").textContent="Ellam clear cheyyuka";$("hint").textContent="Ellam clear aayi.";render()};
$("pt").onclick=function(e){var p=e.target.getAttribute&&e.target.getAttribute("data-p");if(!p)return;P=p;Array.prototype.forEach.call($("pt").children,function(b){b.className=b.getAttribute("data-p")===p?"on":""});render()};$("f").onchange=render;$("t").onchange=render;$("q").oninput=render;var CH=["Chaya","Food","Travel","Petrol","Recharge","Catering"];$("chips").innerHTML=CH.map(function(c){return '<button type="button">'+c+'</button>'}).join("");$("chips").onclick=function(e){if(e.target.tagName==="BUTTON")$("n").value=e.target.textContent};
$("d").value=ds(new Date());
load();$("r").value=rate;render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>
</body>
</html>
